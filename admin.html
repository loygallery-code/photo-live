<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ສ້າງງານໃໝ່ — Wedding Photo Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--ink:#1F2733; --gold:#C9A356; --rose:#C97B84; --paper:#FBF9F6; --line:#E7E1D8;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  header{background:var(--ink);color:var(--paper);padding:30px 20px;text-align:center;}
  header h1{font-family:'Fraunces',serif;font-weight:600;font-size:24px;margin:0;}
  main{max-width:520px;margin:0 auto;padding:26px 18px 60px;}

  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px;}
  label{font-size:13px;color:#6b6459;display:block;margin-bottom:6px;}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-bottom:14px;font-family:'Inter',sans-serif;}
  .btn{width:100%;background:var(--rose);color:#fff;border:none;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
  .btn:disabled{opacity:.5;}

  .result{display:none;}
  .qr-block{text-align:center;margin-top:20px;padding-top:20px;border-top:1px solid var(--line);}
  .qr-block h3{font-family:'Fraunces',serif;font-size:16px;margin-bottom:4px;}
  .qr-block p{font-size:12px;color:#8a8375;word-break:break-all;margin-bottom:12px;}
  .qr-canvas{display:inline-block;padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px;}
</style>
</head>
<body>

<header><h1>ສ້າງງານແຕ່ງໃໝ່</h1></header>

<main>
  <div class="card">
    <label for="eventName">ຊື່ງານ</label>
    <input id="eventName" placeholder="ເຊັ່ນ: ງານແຕ່ງ ສຸກ ແລະ ນ້ອຍ">
    <button class="btn" id="createBtn" onclick="createWeddingEvent()">ສ້າງງານ + ສ້າງ QR</button>
  </div>

  <div class="card result" id="resultCard">
    <div class="qr-block">
      <h3>QR ສຳລັບຊ່າງພາບ</h3>
      <p id="captureUrl"></p>
      <div class="qr-canvas" id="qrCapture"></div>
    </div>
    <div class="qr-block">
      <h3>QR ສຳລັບແຂກ (ເບິ່ງ-ໂຫຼດຮູບ)</h3>
      <p id="galleryUrl"></p>
      <div class="qr-canvas" id="qrGallery"></div>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://uaqupfpuvcsmomlezcxc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhcXVwZnB1dmNzbW9tbGV6Y3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjkwNTIsImV4cCI6MjEwMzMwNTA1Mn0.3_2sp3Icqqg5VAJ5YiJdM0NCJ6IFldIwwMZGx6y_gXg";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const SITE_BASE = "https://photo-live.pages.dev";

function slugify(name) {
  const base = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  const rand = Math.random().toString(36).slice(2, 7);
  return `${base || "event"}-${rand}`;
}

async function createWeddingEvent() {
  const name = document.getElementById('eventName').value.trim();
  if (!name) { alert('ໃສ່ຊື່ງານກ່ອນ'); return; }

  const btn = document.getElementById('createBtn');
  btn.disabled = true; btn.textContent = 'ກຳລັງສ້າງ...';

  try {
    const slug = slugify(name);
    const { data, error } = await sb
      .from('events').insert({ slug, name }).select().single();
    if (error) throw error;

    const captureUrl = `${SITE_BASE}/capture.html?event=${data.slug}`;
    const galleryUrl = `${SITE_BASE}/gallery.html?event=${data.slug}`;

    document.getElementById('captureUrl').textContent = captureUrl;
    document.getElementById('galleryUrl').textContent = galleryUrl;
    document.getElementById('resultCard').style.display = 'block';

    document.getElementById('qrCapture').innerHTML = '';
    document.getElementById('qrGallery').innerHTML = '';
    new QRCode(document.getElementById('qrCapture'), { text: captureUrl, width: 180, height: 180 });
    new QRCode(document.getElementById('qrGallery'), { text: galleryUrl, width: 180, height: 180 });
  } catch (err) {
    alert('ຜິດພາດ: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'ສ້າງງານ + ສ້າງ QR';
  }
}
</script>
</body>
</html>
