<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Photographer Mode — Photo Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1F2733; --gold:#C9A356; --rose:#C97B84;
    --paper:#FBF9F6; --line:#E7E1D8; --ok:#5B8A6B; --err:#B4534C;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  header{background:var(--ink);color:var(--paper);padding:28px 20px 22px;text-align:center;}
  header .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  header h1{font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0;}
  header .counter{font-family:'Fraunces',serif;font-size:15px;color:#cfcabf;margin-top:8px;}
  header .counter b{color:var(--gold);font-size:20px;}

  main{max-width:520px;margin:0 auto;padding:24px 18px 60px;}

  #eventSetup{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px;}
  #eventSetup label{font-size:13px;color:#6b6459;display:block;margin-bottom:6px;}
  #eventSetup input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:'Inter',sans-serif;}
  #eventSetup .hint{font-size:12px;color:#8a8375;margin-top:8px;}

  .capture-wrap{text-align:center;margin:28px 0 8px;}
  .shutter{
    width:104px;height:104px;border-radius:50%;border:4px solid var(--ink);
    background:var(--paper);display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;position:relative;
  }
  .shutter::after{content:"";width:80px;height:80px;border-radius:50%;background:var(--gold);}
  .shutter:active::after{background:var(--rose);}
  .shutter-label{font-size:13px;color:#6b6459;margin-top:12px;letter-spacing:.04em;}
  input[type=file]{display:none;}

  .divider{display:flex;align-items:center;gap:10px;margin:26px 0;color:#a39c8d;font-size:12px;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .import-btn{
    display:block;width:100%;background:#fff;border:1.5px dashed var(--gold);color:var(--ink);
    padding:16px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;cursor:pointer;
  }
  .import-btn .sub{display:block;font-weight:400;font-size:12px;color:#8a8375;margin-top:4px;}
  .progress{text-align:center;font-size:13px;color:var(--rose);margin-top:10px;font-weight:600;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:28px;}
  .thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#eee;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .badge{position:absolute;bottom:4px;right:4px;font-size:10px;padding:2px 6px;border-radius:20px;background:rgba(0,0,0,.65);color:#fff;}
  .badge.ok{background:var(--ok);}
  .badge.err{background:var(--err);}

  .empty{text-align:center;color:#a39c8d;font-size:14px;margin-top:40px;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Photo Live</div>
  <h1 id="eventTitle">Photographer Mode</h1>
  <div class="counter">Captured <b id="countNum">0</b> photos</div>
</header>

<main>
  <div id="eventSetup">
    <label for="eventSlug">Album Code</label>
    <input id="eventSlug" placeholder="e.g. souk-noy-2026-abcde" autocomplete="off">
    <div class="hint">Get this code from admin.html after creating an album. Saved automatically on this device.</div>
  </div>

  <div class="capture-wrap">
    <label class="shutter" for="cameraInput"></label>
    <div class="shutter-label">Tap to take a photo</div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
  </div>

  <div class="divider">or</div>

  <label class="import-btn" for="galleryInput">
    📥 Import photos from Nikon camera (SnapBridge)
    <span class="sub">Select multiple photos at once from your phone gallery</span>
  </label>
  <input type="file" id="galleryInput" accept="image/*" multiple>
  <div id="progress" class="progress" style="display:none"></div>

  <div id="grid" class="grid"></div>
  <div id="emptyMsg" class="empty">No photos yet — tap the button above to start</div>
</main>

<script>
const SUPABASE_URL = "https://uaqupfpuvcsmomlezcxc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhcXVwZnB1dmNzbW9tbGV6Y3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjkwNTIsImV4cCI6MjEwMzMwNTA1Mn0.3_2sp3Icqqg5VAJ5YiJdM0NCJ6IFldIwwMZGx6y_gXg";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
const slugInput = document.getElementById('eventSlug');
const savedSlug = params.get('event') || localStorage.getItem('wp_event_slug') || '';
slugInput.value = savedSlug;
slugInput.addEventListener('change', () => localStorage.setItem('wp_event_slug', slugInput.value.trim()));

let count = 0;
const grid = document.getElementById('grid');
const emptyMsg = document.getElementById('emptyMsg');
const countNum = document.getElementById('countNum');

let eventIdCache = null;
let eventQualityCache = null;

const QUALITY_PRESETS = {
  social: { maxDim: 1080, quality: 0.80 },
  medium: { maxDim: 2048, quality: 0.85 },
  high:   { maxDim: 4000, quality: 0.92 },
};

async function getEventInfo(slug) {
  if (eventIdCache) return { id: eventIdCache, quality: eventQualityCache };
  const { data: event, error } = await sb
    .from('events').select('id, photo_quality, created_at').eq('slug', slug).single();
  if (error || !event) throw new Error('Album not found — check the album code');

  const expiresAt = new Date(event.created_at).getTime() + 7 * 24 * 60 * 60 * 1000;
  if (Date.now() > expiresAt) throw new Error('This album has expired (albums stay active for 7 days after creation)');

  eventIdCache = event.id;
  eventQualityCache = event.photo_quality || 'medium';
  return { id: eventIdCache, quality: eventQualityCache };
}

// ຫຍໍ້ຮູບຢູ່ໃນ browser ກ່ອນອັບໂຫຼດ, ຕາມລະດັບຄວາມລະອຽດທີ່ແອັດມີນເລືອກໄວ້ໃນ admin.html
function resizeImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
        else { width = Math.round(width * maxDim / height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => {
        URL.revokeObjectURL(objectUrl);
        blob ? resolve(blob) : reject(new Error('Failed to process image'));
      }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Failed to load image')); };
    img.src = objectUrl;
  });
}

async function uploadOneFile(file, slug, tile) {
  const { id: eventId, quality } = await getEventInfo(slug);
  const preset = QUALITY_PRESETS[quality] || QUALITY_PRESETS.medium;
  const resizedBlob = await resizeImage(file, preset.maxDim, preset.quality);

  const path = `${slug}/${crypto.randomUUID()}.jpg`;
  const { error: upErr } = await sb.storage
    .from('wedding-photos').upload(path, resizedBlob, { contentType: 'image/jpeg' });
  if (upErr) throw upErr;

  const { error: insErr } = await sb
    .from('photos').insert({ event_id: eventId, storage_path: path });
  if (insErr) throw insErr;

  if (tile) { tile.badge.textContent = '✓ Uploaded'; tile.badge.className = 'badge ok'; }
  count++; countNum.textContent = count;
}

// Take photos one at a time from the phone camera
document.getElementById('cameraInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  const slug = slugInput.value.trim();
  if (!slug) { alert('Please enter an album code first'); return; }

  emptyMsg.style.display = 'none';
  const tile = addTile(URL.createObjectURL(file), 'Uploading...');
  try {
    await uploadOneFile(file, slug, tile);
  } catch (err) {
    console.error(err);
    tile.badge.textContent = 'Error';
    tile.badge.className = 'badge err';
    alert('Upload failed: ' + (err.message || err));
  }
});

// Bulk-import multiple photos from the gallery (photos from Nikon via SnapBridge)
document.getElementById('galleryInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files);
  e.target.value = '';
  if (files.length === 0) return;

  const slug = slugInput.value.trim();
  if (!slug) { alert('Please enter an album code first'); return; }

  emptyMsg.style.display = 'none';
  const progressEl = document.getElementById('progress');
  progressEl.style.display = 'block';

  let done = 0, failed = 0, firstErrMsg = '';
  for (const file of files) {
    progressEl.textContent = `Uploading ${done + failed + 1}/${files.length}...`;
    const tile = addTile(URL.createObjectURL(file), '...');
    try {
      await uploadOneFile(file, slug, tile);
      done++;
    } catch (err) {
      console.error(err);
      tile.badge.textContent = 'Error';
      tile.badge.className = 'badge err';
      if (!firstErrMsg) firstErrMsg = err.message || String(err);
      failed++;
    }
  }
  progressEl.textContent = failed > 0
    ? `Done ${done} photos, failed ${failed} photos`
    : `✓ All ${done} photos uploaded`;
  if (failed > 0) alert('Some photos failed to upload: ' + firstErrMsg);
  setTimeout(() => { progressEl.style.display = 'none'; }, 4000);
});

function addTile(src, badgeText) {
  const div = document.createElement('div');
  div.className = 'thumb';
  div.innerHTML = `<img src="${src}"><span class="badge">${badgeText}</span>`;
  grid.prepend(div);
  return { el: div, badge: div.querySelector('.badge') };
}
</script>
</body>
</html>
